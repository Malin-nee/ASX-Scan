name: ASX Daily Scan
on:
  schedule:
    - cron: "45 6 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy plotly
      - run: python asx_scanner.py
      - run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs
          git commit -m "ASX scan $(date +%F)" || echo "no changes"
          git push
